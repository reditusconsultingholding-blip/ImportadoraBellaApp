<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Importadora Bella">
  <!--
    El mismo monograma, para la pantalla de inicio del celular.

    Es una copia de icon.svg a propósito y no un import: Next.js arma los dos
    iconos a partir del archivo que encuentra con ese nombre exacto. Si se
    cambia uno hay que cambiar el otro — y conviene, porque el de la pestaña
    puede querer simplificarse para 16 px y este se ve a 180.

    POR QUÉ CAJA LLENA
    Un favicon se ve a 16 píxeles y prácticamente en ningún otro tamaño. A esa
    escala lo único que decide si se lee es CUÁNTA TINTA hay. El icono viejo era
    una letra de trazo fino sobre caja blanca con borde: a 16 px quedaba hueca y
    se perdía contra las pestañas claras. Caja llena y letras macizas es lo
    contrario — una sola mancha verde con dos formas blancas adentro.

    LA B ES SIMÉTRICA, A PROPÓSITO
    En tipografía la panza de abajo se hace más grande que la de arriba: es una
    corrección óptica, porque dos panzas iguales se leen pesadas arriba. Acá se
    eligió la simetría igual, como decisión de marca — a 16 píxeles esa
    corrección no se percibe y lo que queda es una forma más geométrica, que es
    lo que se pidió: pareja arriba y abajo.

    Y como es una decisión y no un descuido, está construida para que se note:
    la letra va de y=8 a y=24 y la unión cae en la mitad exacta, y=16, así que
    cada panza mide 8. Dentro de cada una, la pared de arriba y la de abajo
    miden 2,7 y el hueco 2,6; el hueco de abajo es el de arriba corrido 8 hacia
    abajo, número por número. Si se toca una medida hay que tocar su espejo, o
    la simetría se pierde sin que se vea de inmediato.

    EL RESTO DE LAS MEDIDAS
    La I lleva sus dos travesaños: el detalle que la hace clásica —una I sin
    ellos es un palito— y que le da peso a un carácter que casi no tiene. Va de
    7,8 a 13,0 con el asta centrada en 10,4. La B va de 14,6 a 24,2. El conjunto
    ocupa de 7,8 a 24,2, así que quedan 7,8 de aire a cada lado: está centrado
    de verdad y no de casualidad.

    El fondo es #00674F y no el verde de acción de la app: a 16 px el navegador
    achica la imagen mezclando píxeles, y un verde más oscuro mantiene el
    contraste con el blanco cuando eso pasa.
  -->
  <rect width="32" height="32" rx="7" fill="#00674F"/>
  <g fill="#ffffff">
    <!-- I: travesaño de arriba, asta, travesaño de abajo. -->
    <rect x="7.8" y="8" width="5.2" height="2.5"/>
    <rect x="9.6" y="8" width="1.6" height="16"/>
    <rect x="7.8" y="21.5" width="5.2" height="2.5"/>
    <!-- B: el contorno de las dos panzas iguales y, con evenodd, sus huecos.
         La segunda panza es la primera desplazada 8 en y, sin excepciones. -->
    <path
      fill-rule="evenodd"
      d="M14.6 8H19.6C22.2 8 24.2 9.8 24.2 12C24.2 14.2 22.2 16 19.6 16C22.2 16 24.2 17.8 24.2 20C24.2 22.2 22.2 24 19.6 24H14.6V8Z
         M17.5 10.7H19.4C20.6 10.7 21.4 11.2 21.4 12C21.4 12.8 20.6 13.3 19.4 13.3H17.5V10.7Z
         M17.5 18.7H19.4C20.6 18.7 21.4 19.2 21.4 20C21.4 20.8 20.6 21.3 19.4 21.3H17.5V18.7Z"
    />
  </g>
</svg>
