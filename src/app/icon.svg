<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Importadora Bella">
  <!--
    El icono de la pestaña: la B de Bella, verde sobre fondo claro.

    LA LETRA ES SIMÉTRICA A PROPÓSITO. En tipografía la panza de abajo se hace
    más grande que la de arriba: es una corrección óptica, porque dos panzas
    iguales se ven pesadas arriba. Acá se eligió la simetría igual, como
    decisión de marca — a 16 píxeles esa corrección no se percibe y lo que
    queda es una forma más geométrica.

    Las medidas salen de esa simetría y conviene no tocarlas sueltas:
    la letra mide 22 de alto y la unión cae en la mitad exacta, así que cada
    panza mide 11. Las paredes son 3,2 en los tres lugares —arriba, la barra
    del medio y abajo— y los dos huecos miden 6,2. Los márgenes laterales son
    10,3 iguales, así que está centrada de verdad y no de casualidad.

    El fondo va relleno y no transparente: sin caja propia, la letra desaparece
    cuando la barra del navegador es clara o verdosa.
  -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#ffffff" stroke="#008060" stroke-width="2"/>
  <path
    fill="#008060"
    fill-rule="evenodd"
    d="M10.3 5h5.9a5.5 5.5 0 0 1 0 11h-5.9z
       M10.3 16h5.9a5.5 5.5 0 0 1 0 11h-5.9z
       M14.7 8.2h0.7a3.1 3.1 0 0 1 0 6.2h-0.7z
       M14.7 17.6h0.7a3.1 3.1 0 0 1 0 6.2h-0.7z"
  />
</svg>
