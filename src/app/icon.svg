<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Importadora Bella">
  <!--
    El icono de la pestaña: la B de Bella sobre el verde de la marca.

    La primera versión apilaba formas —un rectángulo para el astil, dos panzas
    encima, y los huecos pintados del color del fondo— y por eso salía torcida:
    cada pieza tenía su propio borde y los bordes no coincidían.

    Esta es UN solo trazo con los huecos recortados de verdad (fill-rule
    evenodd), así que no hay bordes que alinear. Las medidas están calculadas
    para que el grosor sea parejo en los cuatro lados de cada panza: 3,2 de
    pared, 3,4 arriba y abajo, 4,4 de astil. La panza de abajo es más ancha que
    la de arriba, como en cualquier B bien hecha.

    Todo se dimensionó mirando el resultado A 16 PÍXELES, que es donde se ve
    casi siempre: a ese tamaño un trazo fino o un hueco chico se convierten en
    una mancha.
  -->
  <rect width="32" height="32" rx="7" fill="#008060"/>
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M9.7 5h6.2a5 5 0 0 1 0 10h.4a6.05 6.05 0 0 1 0 12.1H9.7z
       M14.1 8.4h1.15a2.45 2.45 0 0 1 0 4.9H14.1z
       M14.1 16.5h1.45a3.55 3.55 0 0 1 0 7.1H14.1z"
  />
</svg>
